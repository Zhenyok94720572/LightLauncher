<title>Light Launcher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: один длинный лендинг. Первый экран — заголовок и сразу рабочее окно лаунчера, дальше возможности, скачивание, поддержка. */
:root{
  --bg:#141516; --bg2:#1a1b1d; --fg:#ececee; --muted:#9a9ca3; --line:#2f3134;
  --accent:#4fb83a; --accent-ink:#0d1f08; --lamp:#f3b55f; --card:#202124;
  --font-d:"Unbounded","Onest",system-ui,sans-serif; --font-b:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --font-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* окно лаунчера всегда тёмное, как в программе */
  --ll-bg:#262626; --ll-side:#1c1c1d; --ll-card:#2f2f31; --ll-card-hi:#38383b; --ll-field:#1a1a1b; --ll-line:#3a3a3d; --ll-mute:#a0a0a6; --ll-green:#3d8c28; --ll-green-hi:#5cc23f; --ll-btn:#6b6b6e;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5f4f0; --bg2:#ebeae4; --fg:#18191b; --muted:#5f6168; --line:#d7d6cf; --accent:#2f8a1f; --accent-ink:#ffffff; --lamp:#b8731c; --card:#ffffff; color-scheme:light}}
:root[data-theme="light"]{--bg:#f5f4f0; --bg2:#ebeae4; --fg:#18191b; --muted:#5f6168; --line:#d7d6cf; --accent:#2f8a1f; --accent-ink:#ffffff; --lamp:#b8731c; --card:#ffffff; color-scheme:light}
:root{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto}
header.top{display:flex;align-items:center;gap:16px;padding:16px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--font-d);font-weight:700;font-size:17px;text-decoration:none}
.brand img{width:38px;height:38px;image-rendering:pixelated}
nav.links{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav.links a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px}
nav.links a:hover{color:var(--fg);background:var(--bg2)}
.langsw{display:flex;gap:4px;margin-left:4px}
.flagbtn{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:5px 8px;display:flex;gap:6px;align-items:center;color:var(--muted);font:600 12.5px var(--font-b);cursor:pointer}
.flagbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
.flagbtn svg{width:22px;height:15px;border-radius:2px;display:block}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:32px;align-items:center;padding:36px 0 28px}
.hero h1{font-family:var(--font-d);font-weight:700;font-size:clamp(30px,5vw,54px);line-height:1.08;margin:0 0 16px;text-wrap:balance;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--lamp)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:52ch;margin:0 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:600 15.5px var(--font-b);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:17px;padding:16px 26px}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,.flagbtn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.meta{font:400 12.5px var(--font-m);color:var(--muted);margin-top:12px}
.lamp{display:grid;place-items:center;position:relative;min-height:220px}
.lamp::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--lamp) 45%,transparent),transparent 68%)}
.lamp img{position:relative;width:min(100%,260px);image-rendering:pixelated;filter:drop-shadow(0 18px 26px rgba(0,0,0,.35))}

.demo-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.demo-head h2,.sec h2{font-family:var(--font-d);font-weight:500;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.shot{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0}
/* ---------- секции ---------- */
.sec{padding:56px 0 8px}
.sec>p.lead{color:var(--muted);max-width:60ch;margin:10px 0 0}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:0;margin-top:26px;border-top:1px solid var(--line)}
.feat div{padding:22px 22px 22px 0;border-bottom:1px solid var(--line)}
.feat h3{font-family:var(--font-d);font-weight:500;font-size:16px;margin:0 0 6px}
.feat p{margin:0;color:var(--muted);font-size:15px}
.dl{margin-top:22px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.dl h3{font-family:var(--font-d);font-weight:500;font-size:22px;margin:0 0 8px}
.dl ol{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
.dl .aside{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:230px}
.don{margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:26px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,color-mix(in srgb,var(--lamp) 14%,var(--bg)),var(--bg))}
.don p{margin:0;max-width:56ch;color:var(--muted)}
.don h3{font-family:var(--font-d);font-weight:500;font-size:22px;margin:0 0 6px;color:var(--fg)}
.don-prices{list-style:none;margin:12px 0 0;padding:0;display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.don-prices b{color:var(--fg);font-weight:600}
#donCode{font-weight:600;color:var(--fg)}
#donCode b{color:var(--lamp);font-family:var(--font-m);font-weight:600}
#donCode a{color:var(--lamp);text-decoration:underline;cursor:pointer}
footer{padding:44px 0 40px;color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}.lamp{order:-1;min-height:150px}.lamp img{width:140px}
  .dl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.how{margin-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.how>div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px}
.how h4{font-family:var(--font-d);font-weight:500;font-size:17px;margin:0 0 8px}
.how ol,.how ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.55}
.how code{font-size:12.5px;background:var(--line);padding:1px 5px;border-radius:5px}
@media(max-width:820px){.how{grid-template-columns:1fr}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-overlay[hidden]{display:none}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:360px;width:100%;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal-close{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:6px}
.modal h3{font-family:var(--font-d);font-weight:500;font-size:20px;margin:0 0 16px;padding-right:20px}
.acct-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.acct-tab{flex:1;background:none;border:none;padding:8px 0;color:var(--muted);font:600 14px var(--font-b);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.acct-tab.active{color:var(--fg);border-color:var(--accent)}
#acctForm label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
#acctForm input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:400 15px var(--font-b)}
.acct-err{color:#e05a4a;font-size:13px;margin-top:10px;min-height:1.2em}
#acctForm button{width:100%;margin-top:16px}
.acct-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.acct-row span{color:var(--muted)}
#acctLogout{width:100%;margin-top:18px}
</style>

let lang=(function(){try{const s=localStorage.getItem("ll-lang");if(s)return s}catch(e){}return (navigator.language||"ru").toLowerCase().startsWith("ru")?"ru":"en"})();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const T=k=>L[lang][k]||k;
const FLAG={ru:'<rect width="22" height="5" fill="#fff"/><rect y="5" width="22" height="5" fill="#0039a6"/><rect y="10" width="22" height="5" fill="#d52b1e"/>',en:'<rect width="22" height="15" fill="#fff"/><g fill="#b22234"><rect width="22" height="1.15"/><rect y="2.3" width="22" height="1.15"/><rect y="4.6" width="22" height="1.15"/><rect y="6.9" width="22" height="1.15"/><rect y="9.2" width="22" height="1.15"/><rect y="11.5" width="22" height="1.15"/><rect y="13.8" width="22" height="1.2"/></g><rect width="9" height="8.1" fill="#3c3b6e"/>'};

const DON_PRICES={go:10,pro:25,ultra:50}; // должно совпадать с TIERS_RUB на сервере (src/util.js)
function renderDonPrices(){
  const ul=$("#donPrices");if(!ul)return;
  const names={go:{ru:"Go",en:"Go"},pro:{ru:"Pro",en:"Pro"},ultra:{ru:"Ultra",en:"Ultra"}};
  ul.innerHTML=Object.entries(DON_PRICES).map(([t,p])=>`<li><b>${names[t][lang]}</b> — ${p}₽ / 30 ${lang==="ru"?"дн.":"days"}</li>`).join("");
}
function updateDonCode(){
  const el=$("#donCode");if(!el)return;
  let nick=null;try{nick=localStorage.getItem("ll-nick")}catch(e){}
  if(nick){
    el.innerHTML=T("don_code_known").replace("{nick}",nick);
  }else{
    el.innerHTML=T("don_code_anon");
    const a=$("#donLoginLink");if(a)a.addEventListener("click",e=>{e.preventDefault();openAcct()});
  }
}
function applyLang(l,save){
  lang=l;try{if(save!==false)localStorage.setItem("ll-lang",l)}catch(e){}
  document.documentElement.lang=l;
  $$("[data-i]").forEach(e=>{const v=T(e.dataset.i);if(/<em>|<a /.test(v))e.innerHTML=v;else e.textContent=v});
  $$(".langsw .flagbtn").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
  renderDonPrices();
  updateDonCode();
}
$$(".langsw .flagbtn").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
applyLang(lang,false);

/* ---------- аккаунт (логин+пароль) ---------- */
const API="https://light-launcher-bot.jeneok5fdg.workers.dev";
const TOKK="ll-token";
const getTok=()=>{try{return localStorage.getItem(TOKK)}catch(e){return null}};
const setTok=t=>{try{t?localStorage.setItem(TOKK,t):localStorage.removeItem(TOKK)}catch(e){}};
async function api(path,body){
  const r=await fetch(API+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body||{})});
  let j={};try{j=await r.json()}catch(e){}
  return {ok:r.ok,json:j};
}
const ERR_MSG={
  nick:{ru:"Ник: 3-8 строчных латинских букв и цифр.",en:"Name: 3-8 lowercase Latin letters or digits."},
  password:{ru:"Пароль: от 8 до 72 символов.",en:"Password must be 8 to 72 characters."},
  auth:{ru:"Неверный ник или пароль.",en:"Wrong name or password."},
  rate:{ru:"Слишком много попыток. Попробуйте через час.",en:"Too many attempts. Try again in an hour."},
  banned:{ru:"Доступ к аккаунту ограничен.",en:"Account access is restricted."},
  token:{ru:"Сессия истекла, войдите снова.",en:"Session expired, please sign in again."},
  net:{ru:"Нет связи с сервером. Попробуйте позже.",en:"Can't reach the server right now. Try again later."},
};
const errText=code=>(ERR_MSG[code]||ERR_MSG.net)[lang]||ERR_MSG.net.ru;
const TIER_NAME={go:{ru:"Go",en:"Go"},pro:{ru:"Pro",en:"Pro"},ultra:{ru:"Ultra",en:"Ultra"},free:{ru:"Без подписки",en:"No subscription"}};
function fmtExp(ts){
  return new Date(ts*1000).toLocaleString(lang==="ru"?"ru-RU":"en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
let acctTab="login";
function setAcctTab(t){
  acctTab=t;
  $$("#acctAuth .acct-tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  $("#acctTitle").textContent=T(t==="login"?"acc_login_h":"acc_reg_h");
  $("#acctSubmit").textContent=T(t==="login"?"acc_login_btn":"acc_reg_btn");
  $("#acctErr").textContent="";
}
let acctOpenedAt=0;
function openAcct(){
  $("#acctCabinet").hidden=true;$("#acctAuth").hidden=false;
  setAcctTab(acctTab);
  $("#acctOverlay").hidden=false;
  acctOpenedAt=Date.now();
}
function closeAcct(){$("#acctOverlay").hidden=true}
async function showCabinet(){
  const tok=getTok();
  if(!tok){openAcct();return}
  const r=await api("/api/me",{device_token:tok});
  if(!r.json||r.json.error){setTok(null);openAcct();return}
  const me=r.json;
  $("#acctAuth").hidden=true;$("#acctCabinet").hidden=false;
  $("#cabNick").textContent=me.nick||"—";
  try{if(me.nick)localStorage.setItem("ll-nick",me.nick)}catch(e){}
  updateDonCode();
  $("#cabTier").textContent=(TIER_NAME[me.tier]||TIER_NAME.free)[lang];
  if(me.tier&&me.tier!=="free"&&me.exp){$("#cabExpRow").hidden=false;$("#cabExp").textContent=fmtExp(me.exp)}
  else{$("#cabExpRow").hidden=true}
  $("#acctOverlay").hidden=false;
}
$("#navAcc").addEventListener("click",e=>{e.preventDefault();getTok()?showCabinet():openAcct()});
$("#acctClose").addEventListener("click",closeAcct);
$("#acctOverlay").addEventListener("click",e=>{if(e.target.id==="acctOverlay")closeAcct()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#acctOverlay").hidden)closeAcct()});
$$("#acctAuth .acct-tab").forEach(b=>b.addEventListener("click",()=>setAcctTab(b.dataset.tab)));
$("#acctLogout").addEventListener("click",()=>{
  const tok=getTok();setTok(null);
  try{localStorage.removeItem("ll-nick")}catch(e){}
  updateDonCode();
  if(tok)api("/api/logout",{device_token:tok}).catch(()=>{});
  closeAcct();
});
$("#acctForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const nick=$("#acctNick").value.trim().toLowerCase();
  const password=$("#acctPass").value;
  const btn=$("#acctSubmit");
  $("#acctErr").textContent="";btn.disabled=true;
  try{
    const hp=$("#acctHp").value;
    const t=acctOpenedAt?Date.now()-acctOpenedAt:0;
    const r=await api(acctTab==="login"?"/api/login":"/api/register",{nick,password,hp,t});
    if(!r.json||!r.json.device_token){$("#acctErr").textContent=errText(r.json&&r.json.error);return}
    setTok(r.json.device_token);
    $("#acctPass").value="";
    await showCabinet();
  }catch(err){
    $("#acctErr").textContent=errText("net");
  }finally{btn.disabled=false}
});
